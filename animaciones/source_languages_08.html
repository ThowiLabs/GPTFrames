<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animaciones Profesionales de Lenguajes de Programación</title>
  <style>
    :root {
      --bg-darker: #0d1117;
      --bg-dark: #161b22;
      --bg-editor: #1f242c;
      --bg-surface: #262c36;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --purple: #bc8cff;
      --orange: #ffa657;
      
      --syn-keyword: #ff7b72;
      --syn-func: #d2a8ff;
      --syn-type: #79c0ff;
      --syn-string: #a5d6ff;
      --syn-number: #79c0ff;
      --syn-comment: #8b949e;
      --syn-var: #ffa657;

      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Fira Code", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-darker);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* BARRA SUPERIOR */
    header {
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }
    .brand-tag {
      background: #238636;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    /* CONTROLES DE LÍNEA DE TIEMPO */
    .timeline-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-editor);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 3px 8px;
    }

    .btn-ctrl {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-ctrl:hover {
      background: var(--bg-surface);
      border-color: var(--border-color);
    }
    .btn-ctrl.active {
      background: var(--accent-hover);
      color: #fff;
    }

    .scrubber-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }
    .scrubber {
      -webkit-appearance: none;
      width: 140px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-color);
      outline: none;
    }
    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .time-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      min-width: 45px;
    }

    /* CONTENEDOR PRINCIPAL */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL (LISTA DE LENGUAJES) */
    .sidebar {
      width: 250px;
      background: var(--bg-dark);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
    }
    .lang-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .lang-item {
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
      border-left: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.3);
    }
    .lang-item:hover {
      background: rgba(88, 166, 255, 0.05);
    }
    .lang-item.active {
      background: var(--bg-editor);
      border-left-color: var(--accent);
      color: #fff;
    }
    .lang-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-num {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 11px;
    }
    .lang-subs {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ÁREA DE TRABAJO DEL LENGUAJE SELECCIONADO */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-editor);
    }

    /* PESTAÑAS SUPERIORES */
    .editor-tabs {
      background: var(--bg-dark);
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }
    .tab {
      padding: 8px 16px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      border-right: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab.active {
      background: var(--bg-editor);
      color: var(--text-main);
      border-bottom: 1px solid var(--bg-editor);
    }
    .tab-status {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    /* GRID DIVIDIDO: EDITOR (IZQ) + SIMULACIÓN SVG (DER) */
    .content-split {
      flex: 1;
      display: grid;
      grid-template-columns: 46% 54%;
      overflow: hidden;
    }

    /* EDITOR DE CÓDIGO */
    .code-panel {
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      background: var(--bg-editor);
      overflow: hidden;
    }
    .panel-header {
      padding: 8px 12px;
      background: rgba(0,0,0,0.15);
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-header .tip {
      font-size: 10px;
      color: var(--warning);
      text-transform: none;
      font-family: var(--font-mono);
    }
    .code-container {
      flex: 1;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      overflow-y: auto;
      user-select: text;
    }
    .code-line {
      display: flex;
      align-items: baseline;
      padding: 0 4px;
      border-radius: 3px;
    }
    .code-line.highlight {
      background: rgba(88, 166, 255, 0.15);
      border-left: 2px solid var(--accent);
      padding-left: 2px;
    }
    .line-no {
      color: #484f58;
      width: 28px;
      text-align: right;
      padding-right: 12px;
      user-select: none;
      font-size: 11px;
    }
    .line-text {
      flex: 1;
      white-space: pre;
    }

    /* TOKEN EDITABLE */
    .editable {
      outline: none;
      border-bottom: 1px dashed var(--accent);
      color: var(--text-main);
      padding: 0 1px;
      cursor: text;
    }
    .editable:focus {
      background: rgba(88, 166, 255, 0.2);
      border-bottom: 1px solid var(--accent);
      border-radius: 2px;
    }

    /* RESALTADO SINTÁCTICO */
    .kw { color: var(--syn-keyword); font-weight: 600; }
    .fn { color: var(--syn-func); }
    .tp { color: var(--syn-type); }
    .st { color: var(--syn-string); }
    .num { color: var(--syn-number); }
    .cm { color: var(--syn-comment); font-style: italic; }
    .vr { color: var(--syn-var); }

    /* PANEL VISUAL (SVG & EFECTOS) */
    .visual-panel {
      display: flex;
      flex-direction: column;
      background: #14181f;
      overflow: hidden;
    }
    .canvas-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .visual-svg {
      width: 100%;
      height: 100%;
      max-height: 380px;
    }

    /* PANEL INFERIOR: CONSOLA / TERMINAL */
    .terminal-panel {
      height: 120px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-darker);
      display: flex;
      flex-direction: column;
    }
    .terminal-header {
      padding: 4px 12px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
    }
    .terminal-body {
      flex: 1;
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      overflow-y: auto;
      color: #7ee787;
      user-select: text;
    }
    .terminal-entry {
      margin-bottom: 2px;
    }
    .terminal-entry .term-dim {
      color: var(--text-muted);
    }
    .terminal-entry .term-info {
      color: var(--accent);
    }
    .terminal-entry .term-warn {
      color: var(--warning);
    }

    /* ESTILOS SVG UNIVERSALES */
    .svg-box {
      fill: #1f242c;
      stroke: var(--border-color);
      stroke-width: 1.5;
      rx: 6;
    }
    .svg-box.active {
      stroke: var(--accent);
      fill: #222c3a;
      filter: drop-shadow(0 0 6px rgba(88, 166, 255, 0.25));
    }
    .svg-box.success {
      stroke: var(--success);
      fill: #1a2c20;
    }
    .svg-box.warning {
      stroke: var(--warning);
      fill: #2f2717;
    }
    .svg-text {
      fill: var(--text-main);
      font-family: var(--font-mono);
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .svg-subtext {
      fill: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 9px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .svg-path {
      fill: none;
      stroke: var(--border-color);
      stroke-width: 1.5;
    }
    .svg-path.flowing {
      stroke: var(--accent);
      stroke-dasharray: 4 4;
      animation: dashMove 0.8s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -8; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header>
    <div class="brand">
      <span class="brand-tag">IDE Core</span>
      <span>ANIMACIONES DE LENGUAJES DE PROGRAMACIÓN</span>
    </div>
    <div class="timeline-controls">
      <button class="btn-ctrl" id="btnStepPrev" title="Paso anterior">&lt; Paso</button>
      <button class="btn-ctrl active" id="btnPlayPause">Pausar</button>
      <button class="btn-ctrl" id="btnStepNext" title="Paso siguiente">Paso &gt;</button>
      <button class="btn-ctrl" id="btnReset">Reiniciar</button>
      <div class="scrubber-container">
        <input type="range" class="scrubber" id="scrubber" min="0" max="100" value="0">
        <span class="time-badge" id="timeBadge">0.0s</span>
      </div>
      <button class="btn-ctrl" id="btnSpeed">1.0x</button>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL -->
  <div class="app-body">
    <!-- BARRA LATERAL CON LOS 10 LENGUAJES -->
    <nav class="sidebar">
      <div class="sidebar-header">Catálogo de Módulos (10)</div>
      <ul class="lang-list" id="langList">
        <!-- Renderizado dinámico -->
      </ul>
    </nav>

    <!-- ÁREA DE TRABAJO -->
    <main class="workspace">
      <div class="editor-tabs">
        <div class="tab active">
          <span class="tab-status"></span>
          <span id="tabFilename">module.ext</span>
        </div>
      </div>

      <div class="content-split">
        <!-- EDITOR DE CÓDIGO -->
        <section class="code-panel">
          <div class="panel-header">
            <span>Editor de Código Fuente</span>
            <span class="tip">Tokens subrayados son editables</span>
          </div>
          <div class="code-container" id="codeEditor">
            <!-- Inyectado dinámicamente -->
          </div>
        </section>

        <!-- PANEL DE ANIMACIÓN VECTORIAL -->
        <section class="visual-panel">
          <div class="panel-header">
            <span>Mecanismo Interno y Visualización de Ejecución</span>
            <span id="visualStatusBadge" class="tip" style="color:var(--accent);">FASE: INICIAL</span>
          </div>
          <div class="canvas-wrapper" id="canvasWrapper">
            <!-- Inyectado dinámicamente según lenguaje -->
          </div>
        </section>
      </div>

      <!-- TERMINAL DE SALIDA -->
      <footer class="terminal-panel">
        <div class="terminal-header">
          <span>SALIDA DE EJECUCIÓN (STDOUT / LOGS)</span>
          <span id="termState">ESTADO: ACTIVO</span>
        </div>
        <div class="terminal-body" id="termOutput">
          <!-- Salida sincrónica -->
        </div>
      </footer>
    </main>
  </div>

  <script>
    /**
     * MODELO DE DATOS: 10 LENGUAJES Y SUS MECANISMOS
     * Los nombres de variables, funciones y estructuras son dinámicos y editables.
     */
    const MODULES = [
      {
        id: "py",
        num: "01",
        name: "Python",
        sub: "Funciones, Clases, Decoradores y Módulos",
        file: "analytics_pipeline.py",
        state: {
          modName: "sys_metric",
          decName: "trace_perf",
          className: "DataPipeline",
          fnName: "transform_records",
          argName: "dataset"
        },
        getCode(s) {
          return [
            { n: 1, html: `<span class="kw">import</span> <span class="editable" data-key="modName">${s.modName}</span>` },
            { n: 2, html: `` },
            { n: 3, html: `<span class="kw">def</span> <span class="fn editable" data-key="decName">${s.decName}</span>(wrapped_fn):` },
            { n: 4, html: `    <span class="kw">def</span> <span class="fn">wrapper</span>(*args, **kwargs):` },
            { n: 5, html: `        print(<span class="st">"--> Interceptando ejecución"</span>)` },
            { n: 6, html: `        <span class="kw">return</span> wrapped_fn(*args, **kwargs)` },
            { n: 7, html: `    <span class="kw">return</span> wrapper` },
            { n: 8, html: `` },
            { n: 9, html: `<span class="kw">class</span> <span class="tp editable" data-key="className">${s.className}</span>:` },
            { n: 10, html: `    @<span class="fn editable" data-key="decName">${s.decName}</span>` },
            { n: 11, html: `    <span class="kw">def</span> <span class="fn editable" data-key="fnName">${s.fnName}</span>(self, <span class="vr editable" data-key="argName">${s.argName}</span>):` },
            { n: 12, html: `        <span class="kw">return</span> len(<span class="vr editable" data-key="argName">${s.argName}</span>) * 10` },
            { n: 13, html: `` },
            { n: 14, html: `pipe = <span class="tp editable" data-key="className">${s.className}</span>()` },
            { n: 15, html: `res = pipe.<span class="fn editable" data-key="fnName">${s.fnName}</span>([10, 20, 30])` }
          ];
        },
        renderSVG(s, progress) {
          const step = Math.min(3, Math.floor(progress * 4));
          const modActive = step >= 0 ? "active" : "";
          const decActive = step >= 1 ? "active" : "";
          const clsActive = step >= 2 ? "active" : "";
          const outActive = step >= 3 ? "success" : "";

          return `
            <svg class="visual-svg" viewBox="0 0 540 260">
              <!-- Módulo importado -->
              <rect class="svg-box ${modActive}" x="20" y="20" width="130" height="60"/>
              <text class="svg-text" x="85" y="45">${s.modName}.py</text>
              <text class="svg-subtext" x="85" y="62">MÓDULO CARGADO</text>

              <!-- Conexión hacia Decorador -->
              <line class="svg-path ${step >= 1 ? 'flowing' : ''}" x1="150" y1="50" x2="200" y2="50"/>

              <!-- Envoltorio Decorador -->
              <rect class="svg-box ${decActive}" x="200" y="20" width="140" height="70"/>
              <text class="svg-text" x="270" y="45">@${s.decName}</text>
              <text class="svg-subtext" x="270" y="62">WRAPPER FUNCTION</text>

              <!-- Conexión a Clase -->
              <line class="svg-path ${step >= 2 ? 'flowing' : ''}" x1="270" y1="90" x2="270" y2="130"/>

              <!-- Clase & Instancia -->
              <rect class="svg-box ${clsActive}" x="180" y="130" width="180" height="100"/>
              <text class="svg-text" x="270" y="155">class ${s.className}</text>
              <text class="svg-subtext" x="270" y="172">MÉTODO: ${s.fnName}()</text>
              <rect x="195" y="185" width="150" height="30" rx="4" fill="#161b22" stroke="${step >= 2 ? '#58a6ff' : '#30363d'}"/>
              <text class="svg-text" x="270" y="203" style="font-size:10px;">self.${s.argName} -> Evaluado</text>

              <!-- Conexión a Retorno -->
              <line class="svg-path ${step >= 3 ? 'flowing' : ''}" x1="360" y1="180" x2="410" y2="180"/>

              <!-- Resultado -->
              <rect class="svg-box ${outActive}" x="410" y="150" width="110" height="60"/>
              <text class="svg-text" x="465" y="175">Retorno: 30</text>
              <text class="svg-subtext" x="465" y="192">RESULTADO OK</text>
            </svg>
          `;
        },
        getLogs(s, progress) {
          const step = Math.min(3, Math.floor(progress * 4));
          const logs = [
            `[PY_EXEC] Importando módulo de espacio de nombres: '${s.modName}'...`,
            step >= 1 ? `[PY_EXEC] Decorador '@${s.decName}' intercepta definición de '${s.fnName}'.` : null,
            step >= 2 ? `[PY_EXEC] Instanciando '${s.className}' en heap: 0x7f9a2b00.` : null,
            step >= 3 ? `[PY_EXEC] ${s.fnName}() completado. Salida producida: 30.` : null
          ];
          return logs.filter(Boolean);
        }
      },
      {
        id: "js",
        num: "02",
        name: "JavaScript",
        sub: "Event Loop, Callbacks, Promises y Async/Await",
        file: "engine_loop.js",
        state: {
          fnAsync: "requestPayload",
          promiseVar: "netTask",
          dataVar: "rawMetrics"
        },
        getCode(s) {
          return [
            { n: 1, html: `<span class="kw">async function</span> <span class="fn editable" data-key="fnAsync">${s.fnAsync}</span>(uri) {` },
            { n: 2, html: `    console.log(<span class="st">"1. Inicio síncrono"</span>);` },
            { n: 3, html: `    <span class="kw">const</span> <span class="vr editable" data-key="promiseVar">${s.promiseVar}</span> = fetch(uri);` },
            { n: 4, html: `    <span class="kw">const</span> <span class="vr editable" data-key="dataVar">${s.dataVar}</span> = <span class="kw">await</span> <span class="vr editable" data-key="promiseVar">${s.promiseVar}</span>;` },
            { n: 5, html: `    console.log(<span class="st">"3. Microtask resuelta"</span>);` },
            { n: 6, html: `    <span class="kw">return</span> <span class="vr editable" data-key="dataVar">${s.dataVar}</span>.size;` },
            { n: 7, html: `}` },
            { n: 8, html: `` },
            { n: 9, html: `<span class="fn editable" data-key="fnAsync">${s.fnAsync}</span>(<span class="st">"/api/stream"</span>);` },
            { n: 10, html: `console.log(<span class="st">"2. Pila principal libre"</span>);` }
          ];
        },
        renderSVG(s, progress) {
          const step = Math.min(3, Math.floor(progress * 4));
          const callstackClass = (step === 0 || step === 3) ? "active" : "";
          const webApiClass = step === 1 ? "active" : "";
          const microQueueClass = step === 2 ? "active" : "";

          return `
            <svg class="visual-svg" viewBox="0 0 540 260">
              <!-- CALL STACK -->
              <rect class="svg-box ${callstackClass}" x="20" y="30" width="130" height="180"/>
              <text class="svg-text" x="85" y="55">CALL STACK</text>
              <rect x="30" y="80" width="110" height="30" rx="3" fill="#161b22" stroke="${step === 0 ? '#58a6ff' : '#30363d'}"/>
              <text class="svg-text" x="85" y="98" style="font-size:10px;">${step === 0 ? s.fnAsync + '()' : 'global()'}</text>
              ${step === 3 ? `<rect x="30" y="120" width="110" height="30" rx="3" fill="#1a2c20" stroke="#3fb950"/><text class="svg-text" x="85" y="138" style="font-size:10px;">resume: ${s.fnAsync}</text>` : ''}

              <!-- WEB APIs -->
              <rect class="svg-box ${webApiClass}" x="190" y="30" width="140" height="80"/>
              <text class="svg-text" x="260" y="55">WEB API / NODE</text>
              <text class="svg-subtext" x="260" y="75">${s.promiseVar}: fetch()</text>

              <!-- MICROTASK QUEUE -->
              <rect class="svg-box ${microQueueClass}" x="190" y="130" width="140" height="80"/>
              <text class="svg-text" x="260" y="155">MICROTASK QUEUE</text>
              <text class="svg-subtext" x="260" y="175">Promise.resolve(${s.dataVar})</text>

              <!-- EVENT LOOP RING -->
              <circle cx="420" cy="120" r="50" fill="#1f242c" stroke="${step >= 2 ? '#bc8cff' : '#30363d'}" stroke-width="2"/>
              <path d="M 420 70 A 50 50 0 0 1 470 120" fill="none" stroke="#bc8cff" stroke-width="3" stroke-dasharray="6 6"/>
              <text class="svg-text" x="420" y="115">EVENT</text>
              <text class="svg-text" x="420" y="132">LOOP</text>

              <!-- RUTA DE FLUJO -->
              <path class="svg-path ${step >= 2 ? 'flowing' : ''}" d="M 330 170 L 370 170 L 420 170"/>
            </svg>
          `;

    /**
     * MOTOR DE CONTROL Y ANIMACIÓN
     */
    class EngineController {
      constructor() {
        this.currentIndex = 0;
        this.progress = 0.0; // 0.0 a 1.0
        this.isPlaying = true;
        this.speed = 1.0;
        this.lastTimestamp = null;
        this.duration = 4500; // ms por ciclo

        this.initDOM();
        this.bindEvents();
        this.renderSidebar();
        this.loadCurrentModule();
        this.startLoop();
      }

      initDOM() {
        this.dom = {
          langList: document.getElementById("langList"),
          tabFilename: document.getElementById("tabFilename"),
          codeEditor: document.getElementById("codeEditor"),
          canvasWrapper: document.getElementById("canvasWrapper"),
          termOutput: document.getElementById("termOutput"),
          visualStatusBadge: document.getElementById("visualStatusBadge"),
          btnPlayPause: document.getElementById("btnPlayPause"),
          btnStepPrev: document.getElementById("btnStepPrev"),
          btnStepNext: document.getElementById("btnStepNext"),
          btnReset: document.getElementById("btnReset"),
          btnSpeed: document.getElementById("btnSpeed"),
          scrubber: document.getElementById("scrubber"),
          timeBadge: document.getElementById("timeBadge")
        };
      }

      bindEvents() {
        this.dom.btnPlayPause.addEventListener("click", () => this.togglePlay());
        this.dom.btnReset.addEventListener("click", () => this.resetAnimation());
        this.dom.btnStepNext.addEventListener("click", () => this.stepRelative(0.25));
        this.dom.btnStepPrev.addEventListener("click", () => this.stepRelative(-0.25));
        
        this.dom.btnSpeed.addEventListener("click", () => {
          if (this.speed === 1.0) this.speed = 1.75;
          else if (this.speed === 1.75) this.speed = 0.5;
          else this.speed = 1.0;
          this.dom.btnSpeed.textContent = this.speed + "x";
        });

        this.dom.scrubber.addEventListener("input", (e) => {
          this.progress = parseFloat(e.target.value) / 100;
          this.syncVisuals();
        });

        // Manejo de edición directa en el editor de código
        this.dom.codeEditor.addEventListener("input", (e) => {
          if (e.target.classList.contains("editable")) {
            const key = e.target.dataset.key;
            const val = e.target.textContent.trim();
            if (key) {
              MODULES[this.currentIndex].state[key] = val;
              this.syncVisuals();
            }
          }
        });
      }

      togglePlay() {
        this.isPlaying = !this.isPlaying;
        this.dom.btnPlayPause.textContent = this.isPlaying ? "Pausar" : "Reproducir";
        this.dom.btnPlayPause.classList.toggle("active", this.isPlaying);
      }

      stepRelative(delta) {
        this.isPlaying = false;
        this.dom.btnPlayPause.textContent = "Reproducir";
        this.dom.btnPlayPause.classList.remove("active");
        this.progress = Math.min(1, Math.max(0, this.progress + delta));
        this.dom.scrubber.value = Math.round(this.progress * 100);
        this.syncVisuals();
      }

      resetAnimation() {
        this.progress = 0;
        this.dom.scrubber.value = 0;
        this.syncVisuals();
      }

      renderSidebar() {
        this.dom.langList.innerHTML = MODULES.map((m, idx) => `
          <li class="lang-item ${idx === this.currentIndex ? 'active' : ''}" data-index="${idx}">
            <div class="lang-title">
              <span class="lang-num">${m.num}</span>
              <span>${m.name}</span>
            </div>
            <div class="lang-subs">${m.sub}</div>
          </li>
        `).join("");

        this.dom.langList.querySelectorAll(".lang-item").forEach(item => {
          item.addEventListener("click", () => {
            const idx = parseInt(item.dataset.index, 10);
            this.switchModule(idx);
          });
        });
      }

      switchModule(index) {
        if (index === this.currentIndex) return;
        this.currentIndex = index;
        this.progress = 0;
        this.dom.scrubber.value = 0;
        
        // Actualizar sidebar activa
        this.dom.langList.querySelectorAll(".lang-item").forEach((el, i) => {
          el.classList.toggle("active", i === index);
        });

        this.loadCurrentModule();
      }

      loadCurrentModule() {
        const mod = MODULES[this.currentIndex];
        this.dom.tabFilename.textContent = mod.file;
        this.renderCodeLines();
        this.syncVisuals();
      }

      renderCodeLines() {
        const mod = MODULES[this.currentIndex];
        const lines = mod.getCode(mod.state);
        this.dom.codeEditor.innerHTML = lines.map(line => `
          <div class="code-line" data-line="${line.n}">
            <span class="line-no">${line.n}</span>
            <span class="line-text">${line.html}</span>
          </div>
        `).join("");
      }

      syncVisuals() {
        const mod = MODULES[this.currentIndex];
        
        // 1. Actualizar Diagrama SVG
        this.dom.canvasWrapper.innerHTML = mod.renderSVG(mod.state, this.progress);

        // 2. Actualizar Terminal
        const logs = mod.getLogs(mod.state, this.progress);
        this.dom.termOutput.innerHTML = logs.map(l => `
          <div class="terminal-entry"><span class="term-dim">&gt;</span> ${l}</div>
        `).join("");

        // 3. Resaltar Líneas de código activas según fase
        const step = Math.min(3, Math.floor(this.progress * 4));
        const stepNames = ["1/4: DEFINICIÓN", "2/4: EVALUACIÓN", "3/4: OPERACIÓN", "4/4: RESOLUCIÓN"];
        this.dom.visualStatusBadge.textContent = stepNames[step];

        const lines = this.dom.codeEditor.querySelectorAll(".code-line");
        lines.forEach(l => l.classList.remove("highlight"));
        if (lines.length > 0) {
          const targetIndex = Math.min(lines.length - 1, Math.floor(step * (lines.length / 4)));
          if (lines[targetIndex]) lines[targetIndex].classList.add("highlight");
        }

        // 4. Indicador de tiempo
        const curSeconds = (this.progress * (this.duration / 1000)).toFixed(1);
        this.dom.timeBadge.textContent = `${curSeconds}s`;
      }

      startLoop() {
        const loop = (timestamp) => {
          if (!this.lastTimestamp) this.lastTimestamp = timestamp;
          const delta = timestamp - this.lastTimestamp;
          this.lastTimestamp = timestamp;

          if (this.isPlaying) {
            this.progress += (delta / this.duration) * this.speed;
            if (this.progress > 1) {
              this.progress = 0; // Reinicio cíclico continuo
            }
            this.dom.scrubber.value = Math.round(this.progress * 100);
            this.syncVisuals();
          }

          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    }

    // Inicializar al cargar la página
    window.addEventListener("DOMContentLoaded", () => {
      new EngineController();
    });
  </script>
