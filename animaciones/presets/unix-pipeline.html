<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .pipe-stream { display: flex; align-items: center; gap: 8px; font-size: 11px; }
            .pipe-token { background: #1e293b; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
            .pipe-char { color: var(--c-cyan); font-weight: 900; }
            .anim-engine .data-dot-flow {
              width: 6px; height: 6px; background: var(--c-term-green); border-radius: 50%;
              animation: pipeTravel 1.4s infinite;
            }
            @keyframes pipeTravel { 0% { transform: scale(0.4); opacity: 0; } 50% { opacity: 1; transform: scale(1.3); } 100% { transform: scale(0.4); opacity: 0; } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="pipe-stream">
            <span class="pipe-token">cat log</span>
            <span class="pipe-char">|</span>
            <div class="data-dot-flow"></div>
            <span class="pipe-token">grep ERR</span>
            <span class="pipe-char">|</span>
            <span class="pipe-token">wc -l</span>
          </div></div></div></div></body></html>
