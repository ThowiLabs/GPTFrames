<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .raid-stack { display: flex; gap: 8px; }
            .raid-disk {
              width: 32px; height: 50px; background: #0f172a; border: 2px solid #334155;
              border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-around;
            }
            .anim-engine .raid-led { width: 5px; height: 5px; border-radius: 50%; animation: raidBlink 0.3s steps(2) infinite; }
            @keyframes raidBlink { 0% { background: #334155; } 100% { background: var(--c-term-green); box-shadow: 0 0 6px var(--c-term-green); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="raid-stack">
            <div class="raid-disk"><span style="font-size:7px;">sda</span><div class="raid-led"></div></div>
            <div class="raid-disk"><span style="font-size:7px;">sdb</span><div class="raid-led" style="animation-delay:0.1s;"></div></div>
            <div class="raid-disk"><span style="font-size:7px;">sdc</span><div class="raid-led" style="animation-delay:0.2s;"></div></div>
            <div class="raid-disk"><span style="font-size:7px;">sdd</span><div class="raid-led" style="animation-delay:0.05s;"></div></div>
          </div></div></div></div></body></html>
