<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:transparent;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.anim-engine{width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.stage{width:320px;height:275px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
:root {
      --bg-deep: #080b12;
      --card-bg: #101522;
      --border: #20293d;
      --text-main: #f8fafc;
      --text-muted: #64748b;

      --c-cyan: #00f0ff;
      --c-win: #0078d4;
      --c-linux: #f59e0b;
      --c-green: #10b981;
      --c-red: #ef4444;
      --c-pink: #ff007f;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .cpu-socket {
              width: 140px; height: 140px; background: #064e3b; border: 3px solid #047857;
              border-radius: 12px; position: relative; display: grid; place-items: center;
              box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            }
            .cpu-ihs {
              width: 90px; height: 90px; background: linear-gradient(135deg, #cbd5e1, #64748b, #94a3b8);
              border-radius: 6px; border: 2px solid #475569; display: flex; flex-direction: column;
              align-items: center; justify-content: center; text-align: center; position: relative;
            }
            .cpu-name-text {
              font-family: monospace; font-weight: 900; font-size: 13px; color: #0f172a; letter-spacing: 0.5px;
            }
            .cpu-sub { font-size: 8px; font-family: monospace; color: #1e293b; margin-top: 2px; }
            .anim-engine .circuit-trace {
              position: absolute; stroke: var(--c-cyan); stroke-width: 2; fill: none;
              stroke-dasharray: 20; stroke-dashoffset: 40;
              animation: flowElectricity 1.2s linear infinite;
            }
            @keyframes flowElectricity { to { stroke-dashoffset: 0; } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="cpu-socket">
            <!-- Pistas de energía -->
            <svg style="position:absolute; inset:0; width:100%; height:100%;" viewBox="0 0 100 100">
              <path class="circuit-trace" d="M10,25 L30,25 L30,40" />
              <path class="circuit-trace" d="M90,75 L70,75 L70,60" />
              <path class="circuit-trace" d="M25,90 L25,70 L40,70" />
            </svg>
            <div class="cpu-ihs">
              <span class="cpu-name-text" data-field="cpu_name">Intel Xeon</span>
              <span class="cpu-sub" data-field="cpu_model">E5-2699 v4</span>
              <span style="font-size:7px; color:#334155; margin-top:4px;" data-field="cpu_socket">LGA-2011-v3</span>
            </div>
          </div>
        </div></div></body></html>
