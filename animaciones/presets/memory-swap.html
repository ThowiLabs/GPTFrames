<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .mem-gauge-wrap { width: 85%; display: flex; flex-direction: column; gap: 8px; font-size: 10px; }
            .mem-track { width: 100%; height: 12px; background: #1e293b; border-radius: 4px; overflow: hidden; display: flex; }
            .anim-engine .mem-used { background: var(--c-cyan); height: 100%; animation: memPulse 2s infinite alternate; }
            .anim-engine .mem-buf { background: var(--c-purple); height: 100%; animation: memPulse 2s infinite alternate 0.5s; }
            @keyframes memPulse { 0% { width: 40%; } 100% { width: 75%; } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="mem-gauge-wrap">
            <div>Mem: 24.2G / 64.0G (Used/Buffers)</div>
            <div class="mem-track">
              <div class="mem-used" style="width:55%;"></div>
              <div class="mem-buf" style="width:20%;"></div>
            </div>
            <div>Swap: 1.2G / 16.0G</div>
            <div class="mem-track">
              <div style="width:12%;background:var(--c-deb-red);"></div>
            </div>
          </div></div></div></div></body></html>
