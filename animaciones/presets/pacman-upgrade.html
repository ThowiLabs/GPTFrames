<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .pacman-track { width: 140px; height: 30px; display: flex; align-items: center; position: relative; }
            .pac-mouth {
              width: 24px; height: 24px; border-radius: 50%; background: var(--c-tux-yellow);
              clip-path: polygon(100% 0%, 50% 50%, 100% 100%, 0% 100%, 0% 0%);
            }
            .anim-engine .pac-mouth { animation: chomp 0.4s infinite alternate; }
            .anim-engine .pac-pellets {
              display: flex; gap: 14px; margin-left: 10px;
              animation: pelletsMove 1.2s linear infinite;
            }
            .pellet { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
            @keyframes chomp {
              0% { clip-path: polygon(100% 0%, 50% 50%, 100% 100%, 0% 100%, 0% 0%); }
              100% { clip-path: polygon(100% 35%, 50% 50%, 100% 65%, 0% 100%, 0% 0%); }
            }
            @keyframes pelletsMove { from { transform: translateX(0); } to { transform: translateX(-20px); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="pacman-track">
            <div class="pac-mouth"></div>
            <div class="pac-pellets">
              <div class="pellet"></div><div class="pellet"></div>
              <div class="pellet"></div><div class="pellet"></div>
            </div>
          </div></div></div></div></body></html>
