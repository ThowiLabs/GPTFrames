<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .sysd-list { width: 90%; font-size: 11px; display: flex; flex-direction: column; gap: 5px; }
            .sysd-row { opacity: 0; transform: translateX(-10px); }
            .anim-engine .sysd-row:nth-child(1) { animation: rowSlide 0.4s var(--ease-out) 0.1s forwards; }
            .anim-engine .sysd-row:nth-child(2) { animation: rowSlide 0.4s var(--ease-out) 0.4s forwards; }
            .anim-engine .sysd-row:nth-child(3) { animation: rowSlide 0.4s var(--ease-out) 0.7s forwards; }
            .sysd-ok { color: var(--c-term-green); font-weight: bold; }
            @keyframes rowSlide { to { opacity: 1; transform: translateX(0); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="sysd-list">
            <div class="sysd-row">[ <span class="sysd-ok">OK</span> ] Reached target Local FS.</div>
            <div class="sysd-row">[ <span class="sysd-ok">OK</span> ] Started WireGuard VPN tunnel.</div>
            <div class="sysd-row">[ <span class="sysd-ok">OK</span> ] Reached target Multi-User System.</div>
          </div></div></div></div></body></html>
