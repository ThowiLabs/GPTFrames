<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:transparent;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.anim-engine{width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.stage{width:320px;height:275px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
:root {
      --bg-deep: #080b12;
      --card-bg: #101522;
      --border: #20293d;
      --text-main: #f8fafc;
      --text-muted: #64748b;

      --c-cyan: #00f0ff;
      --c-win: #0078d4;
      --c-linux: #f59e0b;
      --c-green: #10b981;
      --c-red: #ef4444;
      --c-pink: #ff007f;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .anim-engine .rx-ring {
              animation: convergeToTip 2s ease-in infinite;
              transform-origin: 50px 30px;
            }
            .anim-engine .rx-ring.d1 { animation-delay: 0s; }
            .anim-engine .rx-ring.d2 { animation-delay: 0.65s; }
            .anim-engine .rx-ring.d3 { animation-delay: 1.3s; }
            @keyframes convergeToTip {
              0% { r: 48px; opacity: 0; stroke-dasharray: 4, 3; stroke-width: 1.5; }
              30% { opacity: 0.8; }
              100% { r: 2px; opacity: 0; stroke-dasharray: 2, 2; stroke-width: 3; }
            }
          </style></head><body><div class="anim-engine"><div class="stage"><svg class="rf-svg-container" viewBox="0 0 100 100">
            <!-- Ondas convergiendo a (50, 30) -->
            <circle class="rx-ring d1" cx="50" cy="30" r="48" fill="none" stroke="var(--c-green)" />
            <circle class="rx-ring d2" cx="50" cy="30" r="48" fill="none" stroke="var(--c-green)" />
            <circle class="rx-ring d3" cx="50" cy="30" r="48" fill="none" stroke="var(--c-green)" />
            <!-- Torre Física -->
            <circle cx="50" cy="30" r="4.5" fill="var(--c-green)" />
            <line x1="50" y1="34" x2="50" y2="92" stroke="#94a3b8" stroke-width="2.5" />
            <line x1="50" y1="42" x2="30" y2="92" stroke="#64748b" stroke-width="2" />
            <line x1="50" y1="42" x2="70" y2="92" stroke="#64748b" stroke-width="2" />
            <line x1="38" y1="65" x2="62" y2="65" stroke="#64748b" stroke-width="2" />
          </svg>
        </div></div></body></html>
