<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:transparent;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.anim-engine{width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.stage{width:320px;height:275px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
:root {
      --bg-deep: #080b12;
      --card-bg: #101522;
      --border: #20293d;
      --text-main: #f8fafc;
      --text-muted: #64748b;

      --c-cyan: #00f0ff;
      --c-win: #0078d4;
      --c-linux: #f59e0b;
      --c-green: #10b981;
      --c-red: #ef4444;
      --c-pink: #ff007f;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .win-server {
              width: 100%; max-width: 270px; background: #0c121d; border: 2px solid var(--c-win);
              border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
              box-shadow: 0 0 15px rgba(0, 120, 212, 0.2);
            }
            .win-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a2536; padding-bottom: 6px; }
            .win-logo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 14px; height: 14px; }
            .win-tile { background: var(--c-win); }
            .win-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .win-card-metric {
              background: #141c2b; border: 1px solid #223047; padding: 6px; border-radius: 4px;
              text-align: center; font-size: 8px; font-family: monospace;
            }
            .anim-engine .win-pulse-indicator { animation: winGlow 1.6s ease-in-out infinite alternate; }
            @keyframes winGlow { from { opacity: 0.5; } to { opacity: 1; filter: drop-shadow(0 0 4px var(--c-win)); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="win-server">
            <div class="win-header">
              <div style="display:flex;align-items:center;gap:6px;">
                <div class="win-logo-grid">
                  <div class="win-tile"></div><div class="win-tile"></div>
                  <div class="win-tile"></div><div class="win-tile"></div>
                </div>
                <span style="font-size:10px; font-family:monospace; color:#fff;" data-field="system_name">Windows Server 2025</span>
              </div>
              <div class="win-pulse-indicator" style="width:6px; height:6px; background:var(--c-win); border-radius:50%;"></div>
            </div>
            <div class="win-metrics">
              <div class="win-card-metric"><span data-field="service_1" style="color:#64748b;">Hyper-V</span><br><strong style="color:var(--c-green);" data-field="status_1">ACTIVE</strong></div>
              <div class="win-card-metric"><span data-field="service_2" style="color:#64748b;">IIS Core</span><br><strong style="color:var(--c-win);" data-field="status_2">RUNNING</strong></div>
              <div class="win-card-metric"><span data-field="service_3" style="color:#64748b;">AD DS</span><br><strong style="color:var(--c-green);" data-field="status_3">SYNCED</strong></div>
            </div>
          </div>
        </div></div></body></html>
