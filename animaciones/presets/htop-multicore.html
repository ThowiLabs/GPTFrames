<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .htop-grid { width: 90%; display: flex; flex-direction: column; gap: 4px; font-size: 10px; }
            .htop-bar-track { height: 8px; background: #1e293b; border-radius: 2px; overflow: hidden; display: flex; }
            .anim-engine .htop-fill { height: 100%; background: linear-gradient(90deg, var(--c-term-green), var(--c-tux-yellow), var(--c-deb-red)); transform-origin: left; }
            .anim-engine .c1 { animation: coreJump 1.2s infinite alternate 0.1s; }
            .anim-engine .c2 { animation: coreJump 0.9s infinite alternate 0.3s; }
            .anim-engine .c3 { animation: coreJump 1.5s infinite alternate 0.0s; }
            .anim-engine .c4 { animation: coreJump 0.7s infinite alternate 0.4s; }
            @keyframes coreJump { 0% { width: 25%; } 50% { width: 92%; } 100% { width: 45%; } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="htop-grid">
            <div>0 [||||||||||||||  48%]</div>
            <div class="htop-bar-track"><div class="htop-fill c1"></div></div>
            <div>1 [|||||||||||||||||| 86%]</div>
            <div class="htop-bar-track"><div class="htop-fill c2"></div></div>
            <div>2 [|||||||||       31%]</div>
            <div class="htop-bar-track"><div class="htop-fill c3"></div></div>
            <div>3 [||||||||||||||| 64%]</div>
            <div class="htop-bar-track"><div class="htop-fill c4"></div></div>
          </div></div></div></div></body></html>
