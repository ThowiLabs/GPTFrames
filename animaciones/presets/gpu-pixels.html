<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:">
  <title>Canal Gráfico en GPU: De Triángulos a Píxeles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .stage {
      width: min(100vw, calc(100vh * 848 / 480));
      max-width: none;
      aspect-ratio: 848 / 480;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Rótulos principales */
    .title { font-size: 19px; font-weight: 700; fill: #ffffff; }
    .disclaimer { font-size: 11px; fill: #94a3b8; }
    .step-pill-text { font-size: 13px; font-weight: 700; }
    .status-desc { font-size: 12.5px; fill: #e2e8f0; font-weight: 500; }

    /* Control de las 3 fases del pipeline (12s total) */
    /* Fase 1: Geometría (0s - 3.8s) */
    .tab-geom { animation: tabGlow1 12s ease-in-out forwards; }
    .layer-geometry { animation: geomLayerAnim 12s ease-in-out forwards; }

    @keyframes tabGlow1 {
      0%, 30% { fill: #00e5ff; stroke: #00e5ff; }
      34%, 100% { fill: #64748b; stroke: transparent; }
    }
    @keyframes geomLayerAnim {
      0% { opacity: 0; }
      8%, 28% { opacity: 1; }
      35% { opacity: 0.35; }
      68%, 100% { opacity: 0.15; }
    }

    /* Fase 2: Fragmentos (3.8s - 8.0s) */
    .tab-frag { animation: tabGlow2 12s ease-in-out forwards; }
    .layer-fragments { animation: fragLayerAnim 12s ease-in-out forwards; }

    @keyframes tabGlow2 {
      0%, 29% { fill: #64748b; stroke: transparent; }
      33%, 66% { fill: #c084fc; stroke: #c084fc; }
      70%, 100% { fill: #64748b; stroke: transparent; }
    }
    @keyframes fragLayerAnim {
      0%, 28% { opacity: 0; pointer-events: none; }
      34%, 66% { opacity: 1; }
      72%, 100% { opacity: 0; }
    }

    /* Bloques de fragmentos calculándose en paralelo */
    .frag-tile-a { animation: tileCalcA 12s ease-in-out forwards; }
    .frag-tile-b { animation: tileCalcB 12s ease-in-out forwards; }
    .frag-tile-c { animation: tileCalcC 12s ease-in-out forwards; }
    .frag-tile-d { animation: tileCalcD 12s ease-in-out forwards; }

    @keyframes tileCalcA {
      0%, 32% { fill: transparent; stroke: transparent; }
      36% { fill: rgba(192, 132, 252, 0.25); stroke: #c084fc; }
      48%, 68% { fill: rgba(192, 132, 252, 0.7); stroke: #ffffff; }
      72%, 100% { opacity: 0; }
    }
    @keyframes tileCalcB {
      0%, 34% { fill: transparent; stroke: transparent; }
      38% { fill: rgba(147, 51, 234, 0.25); stroke: #a855f7; }
      50%, 68% { fill: rgba(147, 51, 234, 0.7); stroke: #ffffff; }
      72%, 100% { opacity: 0; }
    }
    @keyframes tileCalcC {
      0%, 36% { fill: transparent; stroke: transparent; }
      40% { fill: rgba(168, 85, 247, 0.25); stroke: #c084fc; }
      52%, 68% { fill: rgba(168, 85, 247, 0.7); stroke: #ffffff; }
      72%, 100% { opacity: 0; }
    }
    @keyframes tileCalcD {
      0%, 38% { fill: transparent; stroke: transparent; }
      42% { fill: rgba(126, 34, 206, 0.25); stroke: #a855f7; }
      54%, 68% { fill: rgba(126, 34, 206, 0.7); stroke: #ffffff; }
      72%, 100% { opacity: 0; }
    }

    /* Fase 3: Imagen final renderizada (8.0s - 12.0s) */
    .tab-img { animation: tabGlow3 12s ease-in-out forwards; }
    .layer-image { animation: imgLayerAnim 12s ease-in-out forwards; }

    @keyframes tabGlow3 {
      0%, 65% { fill: #64748b; stroke: transparent; }
      70%, 100% { fill: #34d399; stroke: #34d399; }
    }
    @keyframes imgLayerAnim {
      0%, 66% { opacity: 0; transform: scale(0.98); }
      73%, 100% { opacity: 1; transform: scale(1); }
    }

    /* Subtítulos descriptivos sincronizados */
    .desc-step1 { animation: showDesc1 12s step-end forwards; }
    .desc-step2 { animation: showDesc2 12s step-end forwards; }
    .desc-step3 { animation: showDesc3 12s step-end forwards; }

    @keyframes showDesc1 { 0% { opacity: 1; } 32% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes showDesc2 { 0%, 31% { opacity: 0; } 32% { opacity: 1; } 68% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes showDesc3 { 0%, 67% { opacity: 0; } 68% { opacity: 1; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 848 480">
      <defs>
        <!-- Degradados para la imagen final con iluminación por facetas -->
        <linearGradient id="facetTopLeft" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#6366f1"/>
        </linearGradient>
        <linearGradient id="facetTopRight" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#c084fc"/>
          <stop offset="100%" stop-color="#4338ca"/>
        </linearGradient>
        <linearGradient id="facetCenter" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#3b0764"/>
        </linearGradient>
        <linearGradient id="facetBottom" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4f46e5"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
      </defs>

      <!-- Barra superior: Rótulos breves del Pipeline -->
      <g transform="translate(144, 25)">
        <!-- Píldora 1: Geometría -->
        <rect x="0" y="0" width="160" height="34" rx="17" fill="#0c1e2e" stroke="#1e3a5f" stroke-width="1.5"/>
        <text class="tab-geom step-pill-text" x="80" y="22" text-anchor="middle" data-field="label_geom">«Geometría»</text>

        <!-- Flecha 1 -->
        <path d="M 175 17 L 195 17 M 190 12 L 195 17 L 190 22" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

        <!-- Píldora 2: Fragmentos -->
        <rect x="210" y="0" width="160" height="34" rx="17" fill="#1b122c" stroke="#3b2164" stroke-width="1.5"/>
        <text class="tab-frag step-pill-text" x="290" y="22" text-anchor="middle" data-field="label_frag">«Fragmentos»</text>

        <!-- Flecha 2 -->
        <path d="M 385 17 L 405 17 M 400 12 L 405 17 L 400 22" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

        <!-- Píldora 3: Imagen -->
        <rect x="420" y="0" width="140" height="34" rx="17" fill="#0f2520" stroke="#1c473b" stroke-width="1.5"/>
        <text class="tab-img step-pill-text" x="490" y="22" text-anchor="middle" data-field="label_img">«Imagen»</text>
      </g>

      <!-- Área de Lienzo / Visualizador central -->
      <g id="viewport" transform="translate(0, 75)">

        <!-- Cuadrícula de píxeles (Raster Grid de fondo) -->
        <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
          <!-- Líneas verticales -->
          <line x1="264" y1="20" x2="264" y2="310"/>
          <line x1="296" y1="20" x2="296" y2="310"/>
          <line x1="328" y1="20" x2="328" y2="310"/>
          <line x1="360" y1="20" x2="360" y2="310"/>
          <line x1="392" y1="20" x2="392" y2="310"/>
          <line x1="424" y1="20" x2="424" y2="310"/>
          <line x1="456" y1="20" x2="456" y2="310"/>
          <line x1="488" y1="20" x2="488" y2="310"/>
          <line x1="520" y1="20" x2="520" y2="310"/>
          <line x1="552" y1="20" x2="552" y2="310"/>
          <line x1="584" y1="20" x2="584" y2="310"/>
          <!-- Líneas horizontales -->
          <line x1="264" y1="20" x2="584" y2="20"/>
          <line x1="264" y1="52" x2="584" y2="52"/>
          <line x1="264" y1="84" x2="584" y2="84"/>
          <line x1="264" y1="116" x2="584" y2="116"/>
          <line x1="264" y1="148" x2="584" y2="148"/>
          <line x1="264" y1="180" x2="584" y2="180"/>
          <line x1="264" y1="212" x2="584" y2="212"/>
          <line x1="264" y1="244" x2="584" y2="244"/>
          <line x1="264" y1="276" x2="584" y2="276"/>
          <line x1="264" y1="308" x2="584" y2="308"/>
        </g>

        <!-- CAPA 1: Geometría (Malla de triángulos) -->
        <g class="layer-geometry">
          <!-- Triángulo superior izquierdo -->
          <polygon points="424,30 328,116 424,180" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
          <!-- Triángulo superior derecho -->
          <polygon points="424,30 520,116 424,180" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
          <!-- Triángulo inferior izquierdo -->
          <polygon points="328,116 424,180 424,295" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
          <!-- Triángulo inferior derecho -->
          <polygon points="520,116 424,180 424,295" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
          <!-- Flancos exteriores -->
          <polygon points="328,116 280,180 424,295" fill="none" stroke="#00b4d8" stroke-width="2" stroke-dasharray="4 3"/>
          <polygon points="520,116 568,180 424,295" fill="none" stroke="#00b4d8" stroke-width="2" stroke-dasharray="4 3"/>

          <!-- Vértices destacados -->
          <circle cx="424" cy="30" r="5" fill="#00e5ff"/>
          <circle cx="328" cy="116" r="5" fill="#00e5ff"/>
          <circle cx="520" cy="116" r="5" fill="#00e5ff"/>
          <circle cx="424" cy="180" r="5" fill="#00e5ff"/>
          <circle cx="424" cy="295" r="5" fill="#00e5ff"/>
        </g>

        <!-- CAPA 2: Fragmentos calculados en paralelo por zonas -->
        <g class="layer-fragments">
          <!-- Zona A: Cuadrante Superior Izquierdo -->
          <g class="frag-tile-a">
            <rect x="360" y="52" width="32" height="32" rx="2"/>
            <rect x="392" y="52" width="32" height="32" rx="2"/>
            <rect x="360" y="84" width="32" height="32" rx="2"/>
            <rect x="392" y="84" width="32" height="32" rx="2"/>
            <rect x="360" y="116" width="32" height="32" rx="2"/>
            <rect x="392" y="116" width="32" height="32" rx="2"/>
            <text x="320" y="70" fill="#c084fc" font-size="10" font-weight="700">Zona A</text>
          </g>

          <!-- Zona B: Cuadrante Superior Derecho -->
          <g class="frag-tile-b">
            <rect x="424" y="52" width="32" height="32" rx="2"/>
            <rect x="456" y="52" width="32" height="32" rx="2"/>
            <rect x="424" y="84" width="32" height="32" rx="2"/>
            <rect x="456" y="84" width="32" height="32" rx="2"/>
            <rect x="424" y="116" width="32" height="32" rx="2"/>
            <rect x="456" y="116" width="32" height="32" rx="2"/>
            <text x="495" y="70" fill="#c084fc" font-size="10" font-weight="700">Zona B</text>
          </g>

          <!-- Zona C: Cuadrante Inferior Izquierdo -->
          <g class="frag-tile-c">
            <rect x="328" y="148" width="32" height="32" rx="2"/>
            <rect x="360" y="148" width="32" height="32" rx="2"/>
            <rect x="392" y="148" width="32" height="32" rx="2"/>
            <rect x="360" y="180" width="32" height="32" rx="2"/>
            <rect x="392" y="180" width="32" height="32" rx="2"/>
            <rect x="392" y="212" width="32" height="32" rx="2"/>
            <text x="310" y="225" fill="#c084fc" font-size="10" font-weight="700">Zona C</text>
          </g>

          <!-- Zona D: Cuadrante Inferior Derecho -->
          <g class="frag-tile-d">
            <rect x="424" y="148" width="32" height="32" rx="2"/>
            <rect x="456" y="148" width="32" height="32" rx="2"/>
            <rect x="488" y="148" width="32" height="32" rx="2"/>
            <rect x="424" y="180" width="32" height="32" rx="2"/>
            <rect x="456" y="180" width="32" height="32" rx="2"/>
            <rect x="424" y="212" width="32" height="32" rx="2"/>
            <text x="515" y="225" fill="#c084fc" font-size="10" font-weight="700">Zona D</text>
          </g>
        </g>

        <!-- CAPA 3: Imagen final (Malla sombreada terminada) -->
        <g class="layer-image">
          <polygon points="424,30 328,116 424,180" fill="url(#facetTopLeft)" stroke="#60a5fa" stroke-width="1.2"/>
          <polygon points="424,30 520,116 424,180" fill="url(#facetTopRight)" stroke="#c084fc" stroke-width="1.2"/>
          <polygon points="328,116 424,180 424,295" fill="url(#facetBottom)" stroke="#38bdf8" stroke-width="1.2"/>
          <polygon points="520,116 424,180 424,295" fill="url(#facetCenter)" stroke="#a855f7" stroke-width="1.2"/>
          <polygon points="328,116 280,180 424,295" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
          <polygon points="520,116 568,180 424,295" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
        </g>
      </g>

      <!-- Subtítulos explicativos dinámicos -->
      <g transform="translate(424, 420)">
        <text class="desc-step1 status-desc" text-anchor="middle" data-field="desc_geom">Fase 1: Los vértices definen la geometría 3D en primitivas poligonales.</text>
        <text class="desc-step2 status-desc" text-anchor="middle" data-field="desc_frag">Fase 2: La GPU interpola y calcula colores por grupos paralelos de fragmentos.</text>
        <text class="desc-step3 status-desc" text-anchor="middle" data-field="desc_img">Fase 3: Imagen terminada lista para desplegarse en pantalla.</text>
      </g>

      <!-- Pie y Disclaimer -->
      <text x="424" y="455" text-anchor="middle" class="disclaimer" data-field="disclaimer">Simplificación del proceso gráfico · El cómputo paralelo procesa fragmentos concurrentemente, sin implicar un núcleo físico por píxel</text>
    </svg>
  </div>
</body>
</html>
