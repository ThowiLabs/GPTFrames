<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .fork-tree-svg { width: 140px; height: 80px; }
            .anim-engine .fork-node {
              animation: forkExplode 1.2s var(--ease-elastic) infinite alternate;
              transform-origin: center;
            }
            @keyframes forkExplode { 0% { transform: scale(0.6); opacity: 0.4; } 100% { transform: scale(1.2); opacity: 1; } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><svg class="fork-tree-svg" viewBox="0 0 140 80">
            <line x1="70" y1="10" x2="35" y2="40" stroke="#475569" stroke-width="2"/>
            <line x1="70" y1="10" x2="105" y2="40" stroke="#475569" stroke-width="2"/>
            <line x1="35" y1="40" x2="18" y2="70" stroke="#475569" stroke-width="2"/>
            <line x1="35" y1="40" x2="52" y2="70" stroke="#475569" stroke-width="2"/>
            <line x1="105" y1="40" x2="88" y2="70" stroke="#475569" stroke-width="2"/>
            <line x1="105" y1="40" x2="122" y2="70" stroke="#475569" stroke-width="2"/>
            <circle class="fork-node" cx="70" cy="10" r="6" fill="var(--c-cyan)"/>
            <circle class="fork-node" cx="35" cy="40" r="5" fill="var(--c-tux-yellow)"/>
            <circle class="fork-node" cx="105" cy="40" r="5" fill="var(--c-tux-yellow)"/>
            <circle class="fork-node" cx="18" cy="70" r="4" fill="var(--c-deb-red)"/>
            <circle class="fork-node" cx="52" cy="70" r="4" fill="var(--c-deb-red)"/>
            <circle class="fork-node" cx="88" cy="70" r="4" fill="var(--c-deb-red)"/>
            <circle class="fork-node" cx="122" cy="70" r="4" fill="var(--c-deb-red)"/>
          </svg></div></div></div></body></html>
