<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .tux-full-svg { width: 75px; height: 75px; }
            .anim-engine .tux-flipper {
              transform-origin: 25px 45px;
              animation: waveFlipper 0.7s ease-in-out infinite alternate;
            }
            @keyframes waveFlipper { from { transform: rotate(0deg); } to { transform: rotate(28deg); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><svg class="tux-full-svg" viewBox="0 0 100 100">
            <!-- Cuerpo Tux -->
            <path d="M50 15 C35 15 28 30 28 50 C28 72 20 85 50 85 C80 85 72 72 72 50 C72 30 65 15 50 15 Z" fill="#fff"/>
            <path d="M50 10 C30 10 20 30 20 55 C20 85 10 90 50 90 C90 90 80 85 80 55 C80 30 70 10 50 10 Z" fill="#0f172a" style="z-index:-1;"/>
            <!-- Ojos y pico -->
            <circle cx="43" cy="38" r="4" fill="#000"/><circle cx="57" cy="38" r="4" fill="#000"/>
            <polygon points="50,42 40,50 60,50" fill="var(--c-tux-orange)"/>
            <!-- Aleta móvil -->
            <path class="tux-flipper" d="M22 45 Q5 60 22 75 Z" fill="#0f172a"/>
          </svg></div></div></div></body></html>
