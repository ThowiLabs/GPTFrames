<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;margin:0}
body{background:transparent;color:#e2e8f0;font-family:ui-monospace,Consolas,Menlo,monospace}
.anim-engine{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:290px;height:235px;display:flex;align-items:center;justify-content:center}
.linux-asset{width:290px;height:215px;display:flex;flex-direction:column;justify-content:center;align-items:center;transform-origin:center;transform:scale(1.18)}
:root {
      --bg: #06090e;
      --card-bg: #0d121d;
      --border: #1a2333;
      --text: #e2e8f0;
      --text-dim: #64748b;

      /* Paleta Linux */
      --c-tux-yellow: #facc15;
      --c-tux-orange: #f97316;
      --c-term-green: #22c55e;
      --c-arch-blue:  #0ea5e9;
      --c-deb-red:    #e11d48;
      --c-ubu-orange: #ea580c;
      --c-cyan:       #06b6d4;
      --c-purple:     #a855f7;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .panic-box {
              width: 90%; background: #000; border: 2px solid var(--c-deb-red);
              padding: 10px; font-size: 10px; line-height: 1.4; color: #ff8597; border-radius: 6px;
            }
            .anim-engine .panic-box { animation: panicFlicker 1.8s infinite; }
            @keyframes panicFlicker {
              0%, 100% { border-color: var(--c-deb-red); box-shadow: 0 0 10px rgba(225,29,72,0.4); }
              50% { border-color: #550a18; box-shadow: none; }
            }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="linux-asset"><div class="panic-box">
            <strong style="color:#fff;background:var(--c-deb-red);padding:1px 4px;">KERNEL PANIC</strong><br>
            [ 0.004128] Fatal: attempted to kill init!<br>
            [ 0.004130] Call Trace: do_exit+0x8a2<br>
            <span style="color:#facc15;">CPU 0: PID 1 comm: systemd tainted</span>
          </div></div></div></div></body></html>
