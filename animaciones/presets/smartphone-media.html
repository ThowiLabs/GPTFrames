<!doctype html><html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:transparent;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.anim-engine{width:100%;height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
.stage{width:320px;height:275px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
:root {
      --bg-deep: #080b12;
      --card-bg: #101522;
      --border: #20293d;
      --text-main: #f8fafc;
      --text-muted: #64748b;

      --c-cyan: #00f0ff;
      --c-win: #0078d4;
      --c-linux: #f59e0b;
      --c-green: #10b981;
      --c-red: #ef4444;
      --c-pink: #ff007f;

      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
    }

            .mobile-frame {
              width: 110px; height: 190px; background: #131926; border: 3px solid #334155;
              border-radius: 24px; padding: 4px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            }
            .notch {
              position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
              width: 30px; height: 6px; background: #000; border-radius: 8px; z-index: 10;
            }
            .mobile-screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; background: #000; }
            .anim-engine .mobile-screen img {
              width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: translateY(15px);
              animation: phoneMediaReveal 1s var(--ease-elastic) forwards;
            }
            @keyframes phoneMediaReveal { to { opacity: 1; transform: translateY(0); } }
          </style></head><body><div class="anim-engine"><div class="stage"><div class="mobile-frame">
