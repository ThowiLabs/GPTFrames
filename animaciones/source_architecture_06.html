<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador Profesional de Arquitecturas de Software</title>
  <style>
    /* =====================================================================
       VARIABLES DE COLOR Y TEMATIZACIÓN (EDITABLES)
       ===================================================================== */
    :root {
      --bg-canvas: #07090e;
      --bg-panel: #0d121d;
      --bg-surface: #131b2e;
      --bg-subtle: #1c2742;
      --border-soft: #233152;
      --border-bright: #384d7a;
      
      --accent-cyan: #00f0ff;
      --accent-cyan-glow: rgba(0, 240, 255, 0.35);
      --accent-green: #00ff9d;
      --accent-green-glow: rgba(0, 255, 157, 0.35);
      --accent-violet: #a855f7;
      --accent-violet-glow: rgba(168, 85, 247, 0.35);
      --accent-amber: #ffb84d;
      --accent-red: #ff4757;

      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --font-mono: "SF Mono", "Fira Code", "Consolas", "Monaco", monospace;
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* =====================================================================
       HEADER / HUD TÉCNICO
       ===================================================================== */
    header {
      background: linear-gradient(180deg, #0f172a 0%, var(--bg-panel) 100%);
      border-bottom: 1px solid var(--border-soft);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent-cyan);
      stroke-width: 2;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-main);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .brand-title span {
      color: var(--accent-cyan);
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse-dot 2s infinite ease-in-out;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* =====================================================================
       MAIN LAYOUT (SIDEBAR + STAGE + CODE INSPECTOR)
       ===================================================================== */
    .app-workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 51px);
      overflow: hidden;
    }

    /* SIDEBAR: SELECTOR DE 10 ARQUITECTURAS */
    .sidebar {
      width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 18px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border-soft);
    }

    .arch-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }

    .arch-item {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(35, 49, 82, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .arch-item:hover {
      background: rgba(28, 39, 66, 0.6);
    }

    .arch-item.active {
      background: rgba(0, 240, 255, 0.08);
      border-left: 3px solid var(--accent-cyan);
    }

    .arch-num {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-dim);
      min-width: 22px;
    }

    .arch-item.active .arch-num {
      color: var(--accent-cyan);
    }

    .arch-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .arch-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arch-item.active .arch-name {
      color: #fff;
    }

    .arch-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* STAGE: LIENZO ANIMADO Y TIMELINE CONTROLS */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #101726 0%, var(--bg-canvas) 80%);
      position: relative;
      overflow: hidden;
    }

    .stage-topbar {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(35, 49, 82, 0.5);
      background: rgba(13, 18, 29, 0.6);
      backdrop-filter: blur(8px);
    }

    .current-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .current-phase {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .current-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      max-width: 650px;
      line-height: 1.4;
    }

    .canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    svg.diagram-viewport {
      width: 100%;
      height: 100%;
      max-width: 860px;
      max-height: 480px;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
    }

    /* CONTROLES DE LA LÍNEA DE TIEMPO (REPRODUCIBLE & SCRUBBABLE) */
    .timeline-dock {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-soft);
      padding: 12px 24px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .scrubber-track {
      position: relative;
      display: flex;
      align-items: center;
      height: 20px;
      cursor: pointer;
    }

    .timeline-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-subtle);
      outline: none;
      position: relative;
      cursor: pointer;
    }

    .timeline-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan-glow);
      cursor: pointer;
      border: 2px solid #fff;
      transition: transform 0.1s;
    }

    .timeline-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-bright);
      color: #fff;
    }

    .btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .time-counter {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .speed-selector {
      display: flex;
      gap: 4px;
      background: var(--bg-surface);
      padding: 2px;
      border-radius: var(--radius);
      border: 1px solid var(--border-soft);
    }

    .btn-speed {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-speed.active {
      background: var(--bg-subtle);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    /* RIGHT DRAWER: CÓDIGO TÉCNICO E INSPECTOR */
    .inspector-panel {
      width: 380px;
      background: #090d15;
      border-left: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .inspector-header {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-soft);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .code-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre;
    }

    /* Syntax Highlighting */
    .c-kw { color: var(--accent-violet); font-weight: bold; }
    .c-fn { color: var(--accent-cyan); }
    .c-str { color: var(--accent-green); }
    .c-cm { color: #52627e; font-style: italic; }
    .c-num { color: var(--accent-amber); }
    .c-hl { background: rgba(0, 240, 255, 0.12); display: block; border-left: 2px solid var(--accent-cyan); margin: 0 -16px; padding: 0 14px; }

    /* SVG Estilos Globales */
    .svg-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      fill: var(--text-main);
    }

    .svg-sub {
      font-family: var(--font-mono);
      font-size: 9px;
      fill: var(--text-dim);
    }

    .node-box {
      fill: var(--bg-panel);
      stroke: var(--border-soft);
      stroke-width: 1.5;
      rx: 6px;
      transition: all 0.3s ease;
    }

    .packet {
      fill: var(--accent-cyan);
      filter: drop-shadow(0 0 6px var(--accent-cyan));
    }
  </style>
</head>
<body>

  <!-- HEADER / TELEMETRÍA -->
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <div class="brand-title">ARCH<span>VIZ</span> <div class="brand-badge">PRO v2.5</div></div>
    </div>
    <div class="system-status">
      <div class="status-dot"></div>
      <span id="telemetry-status">MOTOR: INTERACTIVO (RAF)</span>
      <span style="color:var(--border-bright);">|</span>
      <span id="fps-counter">60 FPS</span>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="app-workspace">
    <!-- PANEL IZQUIERDO: SELECCIÓN DE ARQUITECTURAS -->
    <aside class="sidebar">
      <div class="sidebar-header">Catálogo Arquitectural (10)</div>
      <ul class="arch-list" id="arch-list">
        <!-- Renderizado dinámico vía JS -->
      </ul>
    </aside>

    <!-- ÁREA PRINCIPAL DE ANIMACIÓN -->
    <main class="stage">
      <div class="stage-topbar">
        <div>
          <div class="current-title">
            <span id="stage-num" style="color:var(--accent-cyan);">01</span>
            <span id="stage-name">Arquitectura Monolítica</span>
            <span class="current-phase" id="stage-phase">FASE: EJECUCIÓN</span>
          </div>
          <div class="current-desc" id="stage-desc">
            Cargando especificación de la arquitectura...
          </div>
        </div>
      </div>

      <div class="canvas-container">
        <svg class="diagram-viewport" id="viewport" viewBox="0 0 800 440">
          <defs>
            <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="glow-violet" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--text-dim)"/>
            </marker>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--accent-cyan)"/>
            </marker>
          </defs>
          <g id="diagram-scene"><!-- El contenido SVG se genera dinámicamente según la arquitectura activa --></g>
        </svg>
      </div>

      <!-- DOCK DE LÍNEA DE TIEMPO INTERACTIVA -->
      <footer class="timeline-dock">
        <div class="scrubber-track">
          <input type="range" class="timeline-slider" id="timeline-slider" min="0" max="1000" value="0">
        </div>
        <div class="controls-row">
          <div class="playback-buttons">
            <button class="btn" id="btn-play">
              <svg class="btn-icon" id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span id="play-text">Pausar</span>
            </button>
            <button class="btn" id="btn-restart">
              <svg class="btn-icon" viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"></path><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
              Reiniciar
            </button>
            <span class="time-counter" id="time-display">00.0s / 04.0s</span>
          </div>

          <div class="speed-selector">
            <button class="btn-speed" data-speed="0.5">0.5x</button>
            <button class="btn-speed active" data-speed="1.0">1.0x</button>
            <button class="btn-speed" data-speed="2.0">2.0x</button>
          </div>
        </div>
      </footer>
    </main>

    <!-- INSPECTOR DE CÓDIGO TÉCNICO -->
    <aside class="inspector-panel">
      <div class="inspector-header">
        <span>Implementación Realista</span>
        <span id="code-file" style="color:var(--accent-cyan); text-transform:none;">server.js</span>
      </div>
      <div class="code-container" id="code-view">
        <!-- Código sincronizado -->
      </div>
    </aside>
  </div>

  <script>
    /* =====================================================================
       DATOS EDITABLES DE LAS 10 ARQUITECTURAS
       ===================================================================== */
    const ARCHITECTURES = [
      {
        id: "monolith",
        num: "01",
        name: "Arquitectura Monolítica",
        subtitle: "Bloque único fuertemente acoplado",
        file: "monolith-app.bundle.js",
        desc: "Todo el sistema (autenticación, órdenes, inventario, facturación y capa UI) convive dentro de un solo proceso y base de código. Una falla o bloqueo en una rutina puede afectar todo el servicio.",
        code: `<span class="c-cm">// Despliegue único: Proceso compartido</span>
<span class="c-kw">class</span> <span class="c-fn">MonolithicServer</span> {
  <span class="c-fn">handleRequest</span>(req, res) {
    <span class="c-kw">if</span> (req.url === <span class="c-str">'/checkout'</span>) {
      <span class="c-cm">// Rutinas acopladas en memoria local</span>
      <span class="c-kw">const</span> user = <span class="c-fn">authModule</span>(req);
      <span class="c-kw">const</span> stock = <span class="c-fn">inventoryModule</span>(req.body);
      <span class="c-kw">const</span> pay = <span class="c-fn">billingModule</span>(user, stock);
      <span class="c-fn">directDbWrite</span>(pay);
      res.<span class="c-fn">send</span>({ ok: <span class="c-kw">true</span> });
    }
  }
}`,
        phases: [
          { at: 0.1, label: "Petición HTTP entrante al puerto 8080" },
          { at: 0.4, label: "Llamada interna a Auth y Billing en el mismo proceso" },
          { at: 0.7, label: "Acceso exclusivo a BD Monolítica compartida" },
          { at: 0.9, label: "Respuesta unificada entregada al cliente" }
        ],
        render: (svg, t) => {
          // Contenedor principal gigante
          let html = `
            <rect class="node-box" x="220" y="50" width="360" height="340" stroke="var(--accent-amber)" stroke-dasharray="6,4" fill="#0d1424"/>
            <text x="240" y="80" class="svg-label" fill="var(--accent-amber)">MONOLITH_RUNTIME (Port 8080)</text>
            <text x="240" y="98" class="svg-sub">Single Process / Shared Memory Space</text>
            
            <!-- Módulos fuertemente acoplados adentro -->
            <rect id="m-ui" x="250" y="120" width="140" height="60" class="node-box" />
            <text x="270" y="150" class="svg-label">UI Layer / SSR</text>
            <text x="270" y="165" class="svg-sub">React / Templates</text>

            <rect id="m-auth" x="410" y="120" width="140" height="60" class="node-box" />
            <text x="430" y="150" class="svg-label">Auth Context</text>
            <text x="430" y="165" class="svg-sub">JWT & Session</text>

            <rect id="m-order" x="250" y="210" width="140" height="60" class="node-box" />
            <text x="270" y="240" class="svg-label">Orders Routine</text>
            <text x="270" y="255" class="svg-sub">Order Engine</text>

            <rect id="m-pay" x="410" y="210" width="140" height="60" class="node-box" />
            <text x="430" y="240" class="svg-label">Billing Logic</text>
            <text x="430" y="255" class="svg-sub">Stripe Gateway</text>

            <rect id="m-db" x="250" y="300" width="300" height="65" class="node-box" stroke="var(--accent-cyan)" />
            <text x="340" y="330" class="svg-label" fill="var(--accent-cyan)">Single Relational DB Pool</text>
            <text x="350" y="348" class="svg-sub">Shared SQL Connection</text>

            <!-- Líneas de acoplamiento espagueti -->
            <line x1="320" y1="180" x2="320" y2="210" stroke="#ffb84d" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line x1="480" y1="180" x2="480" y2="210" stroke="#ffb84d" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line x1="390" y1="240" x2="410" y2="240" stroke="#ffb84d" stroke-width="1.5" stroke-dasharray="3,3"/>
            <line x1="390" y1="270" x2="390" y2="300" stroke="#ffb84d" stroke-width="1.5" stroke-dasharray="3,3"/>

            <!-- Cliente externo -->
            <rect x="30" y="180" width="120" height="70" class="node-box" stroke="var(--accent-cyan)" />
            <text x="55" y="215" class="svg-label" fill="var(--accent-cyan)">Client App</text>
            <text x="45" y="235" class="svg-sub">Browser / Mobile</text>

            <!-- Ruta de Petición -->
            <line x1="150" y1="215" x2="220" y2="215" stroke="var(--border-bright)" stroke-width="2" marker-end="url(#arrow)"/>
          `;

          // Paquete animado según t (0 -> 1)
          let px, py;
          if (t < 0.25) {
            let p = t / 0.25;
            px = 150 + p * 100;
            py = 215;
          } else if (t < 0.6) {
            let p = (t - 0.25) / 0.35;
            px = 250 + p * 160;
            py = 210 + Math.sin(p * Math.PI) * 30;
          } else if (t < 0.85) {
            let p = (t - 0.6) / 0.25;
            px = 410 - p * 60;
            py = 240 + p * 60;
          } else {
            let p = (t - 0.85) / 0.15;
            px = 350 - p * 200;
            py = 300 - p * 85;
          }

          html += `<circle cx="${px}" cy="${py}" r="6" class="packet" />`;
          svg.innerHTML = html;
        }
      },
      {
        id: "modular",
        num: "02",
        name: "Arquitectura Modular",
        subtitle: "Archivos autónomos con interfaces explícitas",
        file: "src/modules/index.ts",
        desc: "El sistema se subdivide en ficheros o librerías independientes. La comunicación ocurre estrictamente mediante interfaces tipadas (exports/imports), garantizando encapsulación sin llamadas directas a memoria privada.",
        code: `<span class="c-cm">// Contratos modulares estrictos</span>

    /* =====================================================================
       MOTOR DE ANIMACIÓN Y CONTROL DE LÍNEA DE TIEMPO (VANILLA JS)
       ===================================================================== */
    let currentArchIndex = 0;
    let isPlaying = true;
    let playbackSpeed = 1.0;
    const LOOP_DURATION = 4000; // 4 segundos por ciclo completo
    let progress = 0; // 0.0 a 1.0
    let lastTimestamp = performance.now();

    // Elementos DOM
    const archListEl = document.getElementById("arch-list");
    const stageNumEl = document.getElementById("stage-num");
    const stageNameEl = document.getElementById("stage-name");
    const stageDescEl = document.getElementById("stage-desc");
    const stagePhaseEl = document.getElementById("stage-phase");
    const codeFileEl = document.getElementById("code-file");
    const codeViewEl = document.getElementById("code-view");
    const diagramScene = document.getElementById("diagram-scene");
    const slider = document.getElementById("timeline-slider");
    const btnPlay = document.getElementById("btn-play");
    const playText = document.getElementById("play-text");
    const playIcon = document.getElementById("play-icon");
    const btnRestart = document.getElementById("btn-restart");
    const timeDisplay = document.getElementById("time-display");
    const speedButtons = document.querySelectorAll(".btn-speed");
    const fpsCounter = document.getElementById("fps-counter");

    // Construir la lista lateral de arquitecturas
    function buildSidebar() {
      archListEl.innerHTML = "";
      ARCHITECTURES.forEach((arch, idx) => {
        const li = document.createElement("li");
        li.className = `arch-item ${idx === currentArchIndex ? "active" : ""}`;
        li.innerHTML = `
          <div class="arch-num">${arch.num}</div>
          <div class="arch-info">
            <div class="arch-name">${arch.name}</div>
            <div class="arch-sub">${arch.subtitle}</div>
          </div>
        `;
        li.addEventListener("click", () => switchArchitecture(idx));
        archListEl.appendChild(li);
      });
    }

    function switchArchitecture(index) {
      currentArchIndex = index;
      progress = 0;
      slider.value = 0;
      
      // Actualizar vista activa en sidebar
      document.querySelectorAll(".arch-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === index);
      });

      const current = ARCHITECTURES[currentArchIndex];
      stageNumEl.textContent = current.num;
      stageNameEl.textContent = current.name;
      stageDescEl.textContent = current.desc;
      codeFileEl.textContent = current.file;
      codeViewEl.innerHTML = current.code;

      updatePhaseLabel();
      current.render(diagramScene, progress);
    }

    function updatePhaseLabel() {
      const current = ARCHITECTURES[currentArchIndex];
      let currentPhase = current.phases[0].label;
      for (let p of current.phases) {
        if (progress >= p.at) {
          currentPhase = p.label;
        }
      }
      stagePhaseEl.textContent = currentPhase;
    }

    // Controles de Playback
    function togglePlay() {
      isPlaying = !isPlaying;
      playText.textContent = isPlaying ? "Pausar" : "Reanudar";
      playIcon.innerHTML = isPlaying 
        ? '<polygon points="5 3 19 12 5 21 5 3"></polygon>'
        : '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    }

    btnPlay.addEventListener("click", togglePlay);

    btnRestart.addEventListener("click", () => {
      progress = 0;
      slider.value = 0;
      if (!isPlaying) togglePlay();
    });

    // Control deslizante manual (Scrubber de línea de tiempo)
    slider.addEventListener("input", (e) => {
      progress = parseFloat(e.target.value) / 1000;
      ARCHITECTURES[currentArchIndex].render(diagramScene, progress);
      updatePhaseLabel();
      updateTimeDisplay();
    });

    // Selector de velocidad
    speedButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        speedButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        playbackSpeed = parseFloat(btn.dataset.speed);
      });
    });

    function updateTimeDisplay() {
      const currentSeconds = (progress * (LOOP_DURATION / 1000)).toFixed(1);
      const totalSeconds = (LOOP_DURATION / 1000).toFixed(1);
      timeDisplay.textContent = `${currentSeconds.padStart(4, "0")}s / ${totalSeconds}s`;
    }

    // Bucle de Animación RAF a 60 FPS
    let frameCount = 0;
    let fpsTimer = performance.now();

    function animationLoop(timestamp) {
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      // Cálculo de FPS en tiempo real
      frameCount++;
      if (timestamp - fpsTimer >= 1000) {
        fpsCounter.textContent = `${frameCount} FPS`;
        frameCount = 0;
        fpsTimer = timestamp;
      }

      if (isPlaying) {
        progress += (delta * playbackSpeed) / LOOP_DURATION;
        if (progress >= 1.0) {
          progress = 0.0;
        }
        slider.value = Math.floor(progress * 1000);
        ARCHITECTURES[currentArchIndex].render(diagramScene, progress);
        updatePhaseLabel();
        updateTimeDisplay();
      }

      requestAnimationFrame(animationLoop);
    }

    // Inicialización del sistema
    buildSidebar();
    switchArchitecture(0);
    requestAnimationFrame(animationLoop);
  </script>
