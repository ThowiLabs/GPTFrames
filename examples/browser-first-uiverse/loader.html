<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena CSS | Motion Studio</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 55% 46%, #193458 0%,#0b192d 62%,#081320 100%);font:600 28px/1.25 system-ui, sans-serif;color:#edf9ff}
.stage{width:100vw;height:100vh;display:flex;gap:60px;align-items:center;justify-content:center;padding:36px}
.loader{position:relative;width:190px;height:190px;flex:none;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:9px solid #2b5268;border-top-color:#61e3ca;border-right-color:#80bbff;box-shadow:0 0 44px #5cebc429;animation:rotate 1.8s linear infinite}
.ring.inner{inset:25px;border-width:7px;border-color:transparent;border-top-color:#ffca7c;border-bottom-color:#90a8ff;animation:rotate 1.2s linear infinite reverse}
.core{width:48px;height:48px;background:#6deed4;border-radius:16px;box-shadow:0 0 24px #6deed455;animation:pulse 1.6s ease-in-out infinite}
.status{max-width:340px}
.meta{font-size:15px;font-weight:700;color:#66e9cf;letter-spacing:3px;margin-bottom:22px}
h1{font-size:39px;line-height:1.1;margin:0 0 22px}
p{color:#b8cedc;font-size:19px;font-weight:400;margin:0}
.progress{width:320px;height:6px;border-radius:8px;background:#284459;margin-top:28px;overflow:hidden}
.bar{width:40%;height:100%;background:linear-gradient(90deg,#61e3ca,#80bbff);border-radius:8px;animation:bar 2.1s ease-in-out infinite alternate}
@keyframes rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.68);opacity:.65}50%{transform:scale(1.12);opacity:1}}
@keyframes bar{from{transform:translateX(-95%)}to{transform:translateX(270%)}}
</style>
</head><body>
<div class="stage">
  <div class="loader" aria-label="Animación CSS de procesamiento">
    <div class="ring"></div><div class="ring inner"></div><div class="core"></div>
  </div>
  <div class="status">
    <div class="meta">MOTION STUDIO · CSS</div>
    <h1>ANALIZANDO<br>DATOS</h1>
    <p>Movimiento generado por Chromium.<br>Codificación realizada en C++.</p>
    <div class="progress"><div class="bar"></div></div>
  </div>
</div>
</body></html>
