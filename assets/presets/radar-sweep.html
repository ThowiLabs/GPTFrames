<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:"><style>.show{display:grid;place-items:center;width:100vw;height:100vh}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,Arial,sans-serif}body{background:transparent;color:#effaff}.effect{position:relative;width:320px;height:320px;flex:none;--a:#62e5ce;--b:#8db2ff}.effect i{display:block}

@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(1.12);filter:brightness(1.3)}}
@keyframes expand{0%{transform:scale(.7);opacity:.8}100%{transform:scale(4.5);opacity:0}}
@keyframes wave{0%,100%{transform:translateY(17px);opacity:.5}50%{transform:translateY(-20px);opacity:1}}
@keyframes signal{0%,100%{transform:scaleY(.38)}50%{transform:scaleY(1.02)}}
@keyframes progress{from{width:12%}to{width:96%}}@keyframes drawcheck{45%,100%{stroke-dashoffset:0}}
@keyframes lock{0%,15%{transform:translateY(-16px) rotate(-11deg)}55%,80%,100%{transform:translateY(0) rotate(0)}}
@keyframes scan{0%,100%{transform:translateY(-120%)}70%{transform:translateY(170%)}}@keyframes shieldpulse{0%{opacity:.8;transform:scale(.84)}100%{opacity:0;transform:scale(1.17)}}
@keyframes floatup{0%,100%{transform:translateY(6px)}50%{transform:translateY(-9px)}}@keyframes shimmer{to{left:160%}}
@keyframes datashift{0%,100%{transform:translateY(-28px);opacity:.3}50%{transform:translateY(25px);opacity:1}}
@keyframes dash{to{stroke-dashoffset:-126}}

.p06 .radar{position:absolute;inset:32px;border:2px solid #4b9a99;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 39px,#5cb6b122 40px 41px);overflow:hidden}.p06 .radar:after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,#60ffbe88,transparent 95deg,transparent 360deg);border-radius:50%;animation:spin 3s linear infinite}.p06 .radar:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.7%,#5fb4b133 50%,transparent 50.3%),linear-gradient(0deg,transparent 49.7%,#5fb4b133 50%,transparent 50.3%)}.p06 .blip{position:absolute;background:#a0f6cf;border-radius:50%;width:12px;height:12px;box-shadow:0 0 20px #9bffad;left:115px;top:87px}.p06 .blip.other{left:186px;top:185px;width:8px;height:8px}</style></head><body><div class="show"><div class="effect p06" aria-label="Radar Sweep"><div class="radar"><div class="blip"></div><div class="blip other"></div></div></div></div></body></html>
